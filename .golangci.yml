version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - unconvert
    - revive
  settings:
    errcheck:
      # Saída de CLI para stdout: falha de escrita não tem tratamento útil.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dev-danilocordeiro/sentinela
